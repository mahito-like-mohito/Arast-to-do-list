name: Release APK

# publishes release apks on version tags and the universal apk covers every cpu
on:
  push:
    tags:
      - "v*"
  # manual runs create the tag themselves for git setups that cannot push tags
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis and tests
        run: |
          flutter analyze
          flutter test

      - name: Build universal APK (all architectures)
        run: flutter build apk --release

      - name: Build per-architecture APKs
        run: flutter build apk --release --split-per-abi

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/arast-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/arast-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/arast-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/arast-x86_64.apk

      - name: Create GitHub release with APK assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Arast - installable Android APKs.

            Which file to download:
            - arast-universal.apk: works on every device (largest file)
            - arast-arm64.apk: recommended for phones from roughly 2016 onward
            - arast-arm32.apk: very old 32-bit ARM devices
            - arast-x86_64.apk: rare Intel-based devices and emulators

            Install: download on the phone, tap the file, allow installs from
            that source, then grant the notification and exact-alarm
            permissions on first launch so pre-task alarms can ring.
